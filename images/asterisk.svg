<svg xmlns="http://w3.org" viewBox="0 0 8 8" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Red pixel color -->
    <rect id="p" width="1" height="1" fill="#FF2D55"/>
  </defs>
  
  <!-- Row 1 -->
  <use href="#p" x="1" y="0"/>
  <use href="#p" x="2" y="0"/>
  <use href="#p" x="5" y="0"/>
  <use href="#p" x="6" y="0"/>

  <!-- Row 2 -->
  <use href="#p" x="0" y="1"/>
  <use href="#p" x="3" y="1"/>
  <use href="#p" x="4" y="1"/>
  <use href="#p" x="7" y="1"/>

  <!-- Row 3 & 4 -->
  <use href="#p" x="0" y="2"/>
  <use href="#p" x="1" y="2"/>
  <use href="#p" x="2" y="2"/>
  <use href="#p" x="3" y="2"/>
  <use href="#p" x="4" y="2"/>
  <use href="#p" x="5" y="2"/>
  <use href="#p" x="6" y="2"/>
  <use href="#p" x="7" y="2"/>

  <use href="#p" x="0" y="3"/>
  <use href="#p" x="1" y="3"/>
  <use href="#p" x="2" y="3"/>
  <use href="#p" x="3" y="3"/>
  <use href="#p" x="4" y="3"/>
  <use href="#p" x="5" y="3"/>
  <use href="#p" x="6" y="3"/>
  <use href="#p" x="7" y="3"/>

  <!-- Row 5 -->
  <use href="#p" x="0" y="4"/>
  <use href="#p" x="1" y="4"/>
  <use href="#p" x="2" y="4"/>
  <use href="#p" x="3" y="4"/>
  <use href="#p" x="4" y="4"/>
  <use href="#p" x="5" y="4"/>
  <use href="#p" x="6" y="4"/>
  <use href="#p" x="7" y="4"/>

  <!-- Row 6 -->
  <use href="#p" x="1" y="5"/>
  <use href="#p" x="2" y="5"/>
  <use href="#p" x="3" y="5"/>
  <use href="#p" x="4" y="5"/>
  <use href="#p" x="5" y="5"/>
  <use href="#p" x="6" y="5"/>

  <!-- Row 7 -->
  <use href="#p" x="2" y="6"/>
  <use href="#p" x="3" y="6"/>
  <use href="#p" x="4" y="6"/>
  <use href="#p" x="5" y="6"/>

  <!-- Row 8 -->
  <use href="#p" x="3" y="7"/>
  <use href="#p" x="4" y="7"/>
</svg>
